description: 'Our Next Energy is a US‑based manufacturer of lithium‑ion battery systems for grid storage, rail, defense and industrial applications. The company, backed by Coatue and other investors, builds high‑performance LFP cells and modular energy‑storage solutions, emphasizing fast charging, safety, and sustainability. It operates a manufacturing footprint in Michigan and offers a portfolio of products such as the Aries Grid series, targeting utilities and defense customers.'

